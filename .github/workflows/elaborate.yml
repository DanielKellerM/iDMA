name: elaborate

on:
  workflow_call:
  workflow_dispatch:

jobs:

  # Elaborate the snitch_cluster-gated inst64 frontend (no public concrete
  # instance otherwise) so fork PRs that skip the proprietary EDA sims still
  # catch frontend port/param/elaboration errors. ubuntu-24.04 ships
  # Verilator 5.x via apt.
  elaborate-inst64:
    runs-on: ubuntu-24.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Cache Bender database
        uses: ./.github/actions/bender-db-cache
      -
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      -
        name: Install Bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.0
        with:
          version: 0.32.0
      -
        name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      -
        name: Generate RTL
        run: uv run --locked make idma_hw_all
      -
        name: Elaborate inst64 frontend
        run: uv run --locked make idma_lint_inst64
